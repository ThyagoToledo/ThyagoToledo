name: Update GitHub Stats

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Semanal
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README with authenticated stats
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Atualizar URLs com token no README.md
          sed -i "s|&hide_border=true$|&hide_border=true\&include_all_commits=true\&count_private=true\&token=${PAT_TOKEN}|g" README.md
          sed -i "s|&theme=tokyonight$|&theme=tokyonight\&token=${PAT_TOKEN}|g" README.md

      - name: Update index.html with authenticated stats
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Atualizar URLs com token no index.html
          sed -i "s|&hide_border=true\" |&hide_border=true\&include_all_commits=true\&count_private=true\&token=${PAT_TOKEN}\" |g" index.html
          sed -i "s|&theme=tokyonight\" |&theme=tokyonight\&token=${PAT_TOKEN}\" |g" index.html

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          if git diff --quiet; then
            echo "No changes detected"
          else
            git add README.md index.html
            git commit -m "chore: Update GitHub Stats with authenticated token"
            git push
          fi
