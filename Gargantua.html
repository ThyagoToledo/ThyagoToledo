<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gargantua - Retorno ao Realismo</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Courier New', Courier, monospace;
            pointer-events: none;
            text-shadow: 0 0 5px rgba(0,0,0,1);
        }
        h1 { margin: 0; font-weight: normal; font-size: 1.5rem; letter-spacing: 5px; text-transform: uppercase; color: #fff5e6; }
        p { font-size: 0.8rem; margin-top: 5px; opacity: 0.8; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>Gargantua</h1>
        <p>Renderização Granular • Lente Gravitacional Física</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script id="vertexShader" type="x-shader/x-vertex">
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    </script>

    <script id="fragmentShader" type="x-shader/x-fragment">
        uniform float iTime;
        uniform vec2 iResolution;
        uniform vec3 cameraPos;
        uniform vec3 cameraTarget;
        
        varying vec2 vUv;

        // Configurações (mesma geometria, mais qualidade)
        #define MAX_STEPS 160
        #define BH_RADIUS 1.5
        #define ACCRETION_INNER 2.2
        #define ACCRETION_OUTER 16.0 // Mais amplo como no filme
        #define GLOW_INTENSITY 0.02
        #define PI 3.14159265359

        // Gradiente de corpo negro (Interestelar):
        // branco quente -> creme -> laranja -> marrom escuro
        #define COL_HOT   vec3(1.05, 1.0, 0.97)
        #define COL_WARM  vec3(1.0, 0.85, 0.6)
        #define COL_MID   vec3(0.95, 0.55, 0.2)
        #define COL_COOL  vec3(0.45, 0.17, 0.05)

        // Rotação 2D simples
        mat2 rot(float a) {
            float s = sin(a), c = cos(a);
            return mat2(c, -s, s, c);
        }

        // === TEXTURA V1 (Ruidosa e Granular) ===
        // Isso traz de volta o realismo da poeira que você gostou
        float hash(vec2 p) {
            p = fract(p * vec2(123.34, 456.21));
            p += dot(p, p + 45.32);
            return fract(p.x * p.y);
        }

        float noise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            float a = hash(i);
            float b = hash(i + vec2(1.0, 0.0));
            float c = hash(i + vec2(0.0, 1.0));
            float d = hash(i + vec2(1.0, 1.0));
            return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
        }

        float fbm(vec2 p) {
            float sum = 0.0;
            float amp = 0.5;
            float freq = 1.0;
            // Mais oitavas = filamentos mais finos e suaves
            for(int i = 0; i < 7; i++) {
                sum += noise(p * freq) * amp;
                amp *= 0.55;
                freq *= 2.0;
                p *= rot(0.5);
            }
            return sum;
        }

        // === RUÍDO PERIÓDICO NO ÂNGULO ===
        // Envolve a coordenada angular (mod period) para que o valor em +PI
        // seja idêntico ao de -PI. Isso elimina a emenda (seam) do atan que
        // corta o disco quando a câmera muda de perspectiva.
        float pnoise(vec2 p, float period) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            float y0 = mod(i.y, period);
            float y1 = mod(i.y + 1.0, period);
            float a = hash(vec2(i.x, y0));
            float b = hash(vec2(i.x + 1.0, y0));
            float c = hash(vec2(i.x, y1));
            float d = hash(vec2(i.x + 1.0, y1));
            return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
        }

        // radialC: coordenada radial (não periódica). turn: ângulo em voltas
        // (0..1 por volta completa). M: nº de células por volta (mantém wrap).
        float pfbm(float radialC, float turn, float M) {
            float sum = 0.0;
            float amp = 0.5;
            float freq = 1.0;
            for(int i = 0; i < 7; i++) {
                float period = M * freq;
                vec2 p = vec2(radialC * freq, turn * period);
                sum += pnoise(p, period) * amp;
                amp *= 0.55;
                freq *= 2.0;
            }
            return sum;
        }

        // Mistura de cores estilo corpo negro (t: 0 = frio, 1 = quente)
        vec3 blackbody(float t) {
            t = clamp(t, 0.0, 1.0);
            vec3 c = mix(COL_COOL, COL_MID, smoothstep(0.0, 0.4, t));
            c = mix(c, COL_WARM, smoothstep(0.35, 0.7, t));
            c = mix(c, COL_HOT, smoothstep(0.65, 1.0, t));
            return c;
        }

        // Função do Disco (Lógica da V1 aprimorada)
        vec4 renderDisk(vec3 pos) {
            float r = length(pos);
            
            if (r < ACCRETION_INNER || r > ACCRETION_OUTER) return vec4(0.0);

            // Física Orbital
            float angle = atan(pos.z, pos.x);
            float speed = 3.0 / sqrt(r); // Velocidade Kepleriana

            // Coordenada angular em VOLTAS (continua e periódica: +PI == -PI)
            float turn = (angle - iTime * speed * 0.3) / (2.0 * PI);
            float ru = r - ACCRETION_INNER; // coordenada radial

            // Cisalhamento ESPIRAL: inclina os filamentos em função do raio.
            // Depende só de r (constante no ângulo) => mantém a periodicidade,
            // logo NÃO reintroduz a emenda, mas devolve a direção do movimento.
            float spiral = ru * 0.55;

            // Filamentos fibrosos esticados na direção orbital (como no filme)
            // M = nº de células angulares por volta -> controla a "finura" das fibras
            float streaks = pfbm(ru * 1.6, turn - spiral, 120.0);
            float dust    = pfbm(ru * 3.0, turn - spiral * 0.7 + streaks * 0.05, 94.0);
            float detail  = pfbm(ru * 9.0 + iTime * 0.05, turn - spiral * 0.4, 415.0);

            float density = streaks * 0.45 + dust * 0.4 + detail * 0.25;
            // Contraste suave: realça filamentos sem serrilhar
            density = smoothstep(0.28, 1.05, density);

            // Fade nas bordas (Suavidade)
            density *= smoothstep(ACCRETION_INNER, ACCRETION_INNER + 0.4, r);
            density *= smoothstep(ACCRETION_OUTER, ACCRETION_OUTER - 6.0, r);

            // Perfil vertical (O disco é fino)
            density *= exp(-abs(pos.y) * 10.0);

            // Temperatura cai com o raio; densidade local aquece
            float temp = clamp(1.6 / sqrt(r) * (0.55 + density * 0.8), 0.0, 1.0);
            vec3 col = blackbody(temp);

            // DOPPLER BEAMING (lado que se aproxima brilha e esbranquiça)
            vec3 velDir = normalize(vec3(pos.z, 0.0, -pos.x)); // Vetor tangente
            vec3 viewDir = normalize(pos - cameraPos);
            float doppler = dot(velDir, viewDir);

            float beam = (1.0 + doppler * 0.6);
            beam = beam * beam;

            col *= beam;
            // Blueshift sutil no lado que se aproxima
            col = mix(col, col * vec3(0.95, 1.0, 1.1), clamp(doppler, 0.0, 1.0) * 0.35);
            col *= 1.8 + density * 1.2; // Brilho HDR modulado pela densidade

            return vec4(col, density);
        }

        void main() {
            vec2 uv = (vUv - 0.5) * 2.0;
            uv.x *= iResolution.x / iResolution.y;

            vec3 ro = cameraPos;
            vec3 ta = cameraTarget;
            
            vec3 fwd = normalize(ta - ro);
            vec3 right = normalize(cross(vec3(0.0, 1.0, 0.0), fwd));
            vec3 up = cross(fwd, right);
            vec3 rd = normalize(fwd * 1.5 + right * uv.x + up * uv.y);

            vec3 col = vec3(0.0);
            float transmittance = 1.0;
            
            vec3 p = ro;
            float t = 0.0;
            
            bool hitHorizon = false;

            // RAYMARCHING FÍSICO (A Lente Gravitacional)
            for(int i = 0; i < MAX_STEPS; i++) {
                float distToCenter = length(p);
                
                // Horizonte de Eventos
                if(distToCenter < BH_RADIUS) {
                    hitHorizon = true;
                    // O buraco negro é preto
                    col = mix(col, vec3(0.0), transmittance);
                    break;
                }
                
                // === A CORREÇÃO QUE VOCÊ PEDIU ===
                // Gravidade: Curvar a luz em direção ao centro
                // Aumentei a força em relação à V1 para garantir que vemos a parte de trás do disco
                vec3 gravityDir = normalize(-p);
                // Fórmula visual: força decai com a distância ao quadrado
                float force = 1.8 / (distToCenter * distToCenter); 
                
                // Passo adaptativo: menor perto do centro e do plano do disco
                float stepSize = max(0.04, distToCenter * 0.06);
                stepSize = min(stepSize, max(0.05, abs(p.y) * 0.6 + 0.03));
                rd = normalize(rd + gravityDir * force * stepSize);
                
                // Mover o raio
                vec3 prevP = p;
                p += rd * stepSize;
                t += stepSize;
                
                // Checar interseção com o plano do disco (Y=0)
                // Se cruzamos o plano Y neste passo
                if (prevP.y * p.y < 0.0 || abs(p.y) < 0.15) {
                    // Renderizar disco
                    vec4 diskSample = renderDisk(p);

                    if (diskSample.a > 0.01) {
                         // Acumulação volumétrica ponderada pelo passo
                         float absorb = clamp(diskSample.a * stepSize * 5.0, 0.0, 1.0);
                         col += diskSample.rgb * absorb * transmittance;
                         transmittance *= (1.0 - absorb * 0.85);
                         if (transmittance < 0.03) break;
                    }
                }

                // Anel de fótons: brilho fino colado ao horizonte
                float photonDist = distToCenter - BH_RADIUS * 1.02;
                if (photonDist < 0.35 && photonDist > 0.0) {
                    float ring = exp(-photonDist * 14.0);
                    col += vec3(1.0, 0.92, 0.78) * ring * 0.045 * transmittance;
                }
                
                // Fuga (se o raio for muito longe)
                if(distToCenter > 30.0) break;
            }

            // Fundo Estelar (estável, com brilho e cor variados)
            if (!hitHorizon) {
                 vec2 sp = floor(rd.xy * 240.0);
                 float h = hash(sp);
                 float star = smoothstep(0.995, 1.0, h);
                 float twinkle = 0.7 + 0.3 * sin(iTime * 1.5 + h * 40.0);
                 vec3 starCol = mix(vec3(0.7, 0.8, 1.0), vec3(1.0, 0.9, 0.75), hash(sp + 7.0));
                 col += starCol * star * twinkle * 0.6 * transmittance;
            }

            // Halo suave em volta do buraco (luz espalhada do disco)
            float halo = 0.012 / (length(uv) + 0.15);
            col += vec3(1.0, 0.82, 0.6) * halo * transmittance;

            // Tone Mapping ACES (contraste cinematográfico)
            col *= 0.62;
            col = clamp((col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14), 0.0, 1.0);
            col = pow(col, vec3(0.4545)); // Gamma correction

            // Vinheta sutil
            col *= 1.0 - 0.25 * dot(uv * 0.5, uv * 0.5);

            gl_FragColor = vec4(col, 1.0);
        }
    </script>

    <script>
        let scene, camera, renderer, mesh;
        let uniforms;

        function init() {
            const container = document.body;

            scene = new THREE.Scene();
            camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            
            const geometry = new THREE.PlaneBufferGeometry(2, 2);
            
            // Câmera posicionada como no filme
            const virtualCamera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            virtualCamera.position.set(0, 2, 12);
            
            uniforms = {
                iTime: { value: 0 },
                iResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                cameraPos: { value: virtualCamera.position },
                cameraTarget: { value: new THREE.Vector3(0, 0, 0) }
            };

            const material = new THREE.ShaderMaterial({
                uniforms: uniforms,
                vertexShader: document.getElementById('vertexShader').textContent,
                fragmentShader: document.getElementById('fragmentShader').textContent
            });

            mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(virtualCamera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 3.0;
            controls.maxDistance = 30.0;

            window.addEventListener('resize', onWindowResize, false);

            const animate = function (time) {
                requestAnimationFrame(animate);
                uniforms.iTime.value = time * 0.001;
                controls.update();
                uniforms.cameraPos.value.copy(virtualCamera.position);
                renderer.render(scene, camera);
            };

            animate();
        }

        function onWindowResize() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            uniforms.iResolution.value.x = window.innerWidth;
            uniforms.iResolution.value.y = window.innerHeight;
        }

        init();
    </script>
</body>
</html>
