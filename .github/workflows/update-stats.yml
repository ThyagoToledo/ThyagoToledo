name: Update GitHub Stats

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Semanal
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README with stats
        run: |
          # Atualizar URLs com parâmetros públicos no README.md
          sed -i "s|&hide_border=true$|&hide_border=true\&include_all_commits=true|g" README.md
          sed -i "s|&theme=tokyonight$|&theme=tokyonight|g" README.md

      - name: Update index.html with stats
        run: |
          # Atualizar URLs com parâmetros públicos no index.html
          sed -i "s|&hide_border=true\" |&hide_border=true\&include_all_commits=true\" |g" index.html
          sed -i "s|&theme=tokyonight\" |&theme=tokyonight\" |g" index.html

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          if git diff --quiet; then
            echo "No changes detected"
          else
            git add README.md index.html
            git commit -m "chore: Update GitHub Stats"
            git push
          fi
